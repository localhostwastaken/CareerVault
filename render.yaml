services:
  - type: web
    name: careervault-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # upgrade to standard for more RAM 
    healthCheckPath: /api/v1/health

    # NOT optional with KEY_MANAGEMENT_DRIVER=local. Org signing keys are files under
    # STORAGE_LOCAL_DIR while the database only stores a POINTER to them, so without a
    # mounted disk every deploy wipes the keys, leaves the pointers behind, and every
    # attempt to sign a document fails. Issued PDFs live here too.
    disk:
      name: careervault-storage
      mountPath: /app/server/storage
      sizeGB: 1

    envVars:
      # ── Static config ───────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9900"
      - key: WORKER
        value: "true"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: AI_SERVICE_URL
        value: http://localhost:9910   # internal; same container
      # R10 fail-closed reads. A DB writer without KMS_MASTER_KEY can't make an envelope, so
      # content they write straight into a document row is PLAINTEXT: refused on read, and
      # skipped by the Merkle batch's integrity gate, so our wallet never anchors it. (Issuing
      # through the app after granting themselves memberships is separate: viva guide L15.)
      # Needs no pre-R10 rows left: `npm run db:audit-encryption` must PASS against it first.
      - key: FIELD_ENCRYPTION_STRICT
        value: "true"
      # ── Integration drivers ─────────────────────────────────────────────────
      # ⚠  MOCKED IN THIS DEPLOY — the trust model (signed, domain-verified docs)
      #    is only real when these are switched to their "real" values. Every
      #    driver below except BLOCKCHAIN_DRIVER is a LOCAL/MOCK impl. Boot logs a
      #    loud warning listing each mock (see server/src/config/env.validation.ts).
      #    Flip the ones you need to demo for real and set the matching secrets
      #    further down.
      #      KEY_MANAGEMENT_DRIVER: local (Node RSA)            → aws    (AWS KMS)
      #      BLOCKCHAIN_DRIVER:     local (JSON ledger on disk) → amoy   (Polygon Amoy) — REAL here
      #      PAYMENT_DRIVER:        mock  (free)                → stripe (real billing)
      #      EMAIL_DRIVER:          console (stdout)            → ses    (real email)
      #      STORAGE_DRIVER:        local (disk)                → s3
      #      DNS_DRIVER:            local (BYPASSED)            → real   (TXT-record check)
      - key: KEY_MANAGEMENT_DRIVER
        value: local
      # Real anchoring on Polygon Amoy. POLYGON_RPC_URL, ANCHOR_REGISTRY_ADDRESS and
      # ANCHOR_PRIVATE_KEY (secrets below) MUST be set in the dashboard BEFORE this
      # deploys: under amoy they are required, so boot validation fails without them.
      - key: BLOCKCHAIN_DRIVER
        value: amoy
      - key: PAYMENT_DRIVER
        value: mock
      - key: EMAIL_DRIVER
        value: console
      - key: STORAGE_DRIVER
        value: local
      # DNS_DRIVER=local BYPASSES domain verification: EVERY domain "verifies", so
      # signed documents can be issued as ANY organization. This is the core trust
      # control. Set to "real" for genuine DNS TXT-record checks — required before
      # this deploy can be trusted. Left "local" here only because the seeded demo
      # uses example domains nobody controls; boot logs a warning either way.
      - key: DNS_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /app/server/storage    # backed by the `disk:` above — must stay in sync

      # ── Secrets — set these in the Render dashboard, never commit values ────
      - key: DATABASE_URL            # Supabase transaction pooler (port 6543)
        sync: false
      - key: DIRECT_URL              # Supabase session pooler (port 5432) — for migrations
        sync: false
      - key: CORS_ORIGIN             # your Vercel frontend URL
        sync: false
      - key: JWT_PRIVATE_KEY         # contents of server/keys/jwt_private.pem with \n escaped as \\n
        sync: false
      - key: JWT_PUBLIC_KEY          # contents of server/keys/jwt_public.pem with \n escaped as \\n
        sync: false
      # REQUIRED in production (the app refuses to boot without it). Base64, decoding to
      # exactly 32 bytes: openssl rand -base64 32
      # A hex value will NOT work — it decodes to 48 bytes and fails validation.
      # It wraps every org signing key and derives the key for the R10-encrypted DB fields
      # and stored PDFs: losing or rotating it makes all of them unreadable. Treat it as
      # permanent and keep an offline backup.
      - key: KMS_MASTER_KEY
        sync: false
      - key: GROQ_API_KEY            # enables LLM skill extraction
        sync: false
      - key: AI_SERVICE_SECRET        # shared secret between server and ai-service
        sync: false
      # Polygon anchoring (BLOCKCHAIN_DRIVER=amoy above). Chain id, confirmations and the
      # fee floor keep their Amoy defaults (see server/.env.example).
      - key: POLYGON_RPC_URL          # Amoy JSON-RPC endpoint; hosted URLs embed an API key
        sync: false
      - key: ANCHOR_REGISTRY_ADDRESS  # contracts/deployments/amoy.json → address
        sync: false
      - key: ANCHOR_PRIVATE_KEY       # 0x-prefixed key of the authorized, funded anchor wallet
        sync: false
      # contracts/deployments/amoy.json → blockNumber. Optional: lets a batch retry that finds
      # its root already anchored look up the transaction; unset, it records none.
      - key: ANCHOR_REGISTRY_DEPLOY_BLOCK
        sync: false
